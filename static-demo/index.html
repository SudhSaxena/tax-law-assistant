<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tax Law Assistant</title>
<style>
  :root {
    --bg: #EDEDE4;
    --paper: #F7F6F1;
    --ink: #1F2A24;
    --ink-soft: #4A5750;
    --rule: #C9C7B8;
    --accent: #3B5D50;
    --accent-soft: #B08968;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 32px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: normal;
    margin: 0 0 6px 0;
    letter-spacing: 0.2px;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  form {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    padding: 12px 20px;
    border: none;
    background: var(--accent);
    color: var(--paper);
    font-size: 15px;
    cursor: pointer;
  }

  button:disabled {
    background: var(--ink-soft);
    cursor: default;
  }

  .answer-block {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 24px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .answer-block a {
    color: var(--accent-soft);
  }

  .status {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .sources {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tax Law Assistant</h1>
    <p class="subtitle">Answers US federal income tax questions from IRS Publication 17 and Title 26. General information only, not personalized tax advice.</p>
  </header>

  <form id="ask-form">
    <input type="text" id="question-input" placeholder="e.g. What is the standard deduction?" autocomplete="off">
    <button type="submit" id="submit-btn">Ask</button>
  </form>

  <div id="status" class="status" style="display:none;"></div>
  <div id="answer" class="answer-block" style="display:none;"></div>

  <script>
    const API_URL = "http://localhost:8000/ask/stream";

    const form = document.getElementById("ask-form");
    const input = document.getElementById("question-input");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      submitBtn.disabled = true;
      statusEl.style.display = "none";
      answerEl.style.display = "block";
      answerEl.textContent = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!response.ok || !response.body) {
          throw new Error(`Request failed (${response.status})`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let rawText = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop(); // keep any incomplete trailing chunk

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = JSON.parse(line.slice(6));

            if (payload.delta) {
              // Show raw text immediately as it streams in — internal
              // citation keys like [pub17] appear as plain text here,
              // and get swapped for real links once the stream finishes.
              rawText += payload.delta;
              answerEl.textContent = rawText;
            } else if (payload.done) {
              // Final formatted answer with real citation links
              answerEl.innerHTML = markdownLinksToHtml(payload.formatted_answer);
            }
          }
        }

      } catch (err) {
        statusEl.style.display = "block";
        statusEl.textContent = `Something went wrong: ${err.message}. Is the API running on localhost:8000?`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Minimal helper: turns [text](url) into a real link, and leaves
    // everything else as plain text. Not a full markdown renderer on
    // purpose — we only need to handle the citation format our API produces.
    function markdownLinksToHtml(text) {
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>'
      );
    }
  </script>
</main>
</body>
</html>
